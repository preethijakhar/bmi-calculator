<!DOCTYPE html>
<html>
<head><title>BMI Calculator</title></head>
<body>
  <h1>BMI Calculator</h1>
  <form method="POST">
    <input type="text" name="weight" placeholder="Weight (kg)">
    <input type="text" name="height" placeholder="Height (m)">
    <button type="submit">Calculate</button>
  </form>
  {% if bmi %}
    <h2>Your BMI: {{ bmi }}</h2>
  {% endif %}
</body>
</html>
